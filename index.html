  <body>
    <div id="root"></div>
    <!-- Hidden Native Google Translate -->
    <div id="google_translate_element" style="display: none;"></div>
    
    <!-- Custom Language Switcher -->
    <div class="floating-translate-widget">
      <select id="customLangSelect" onchange="switchLanguage(this.value)">
        <option value="en">English</option>
        <option value="ta">தமிழ்</option>
      </select>
    </div>

    <script type="text/javascript">
      // Sync custom dropdown with current active language
      window.addEventListener('DOMContentLoaded', () => {
        const langSelect = document.getElementById('customLangSelect');
        if (document.cookie.includes('googtrans=/en/ta') || document.cookie.includes('googtrans=auto/ta')) {
          langSelect.value = 'ta';
        } else {
          langSelect.value = 'en';
        }
      });

      function switchLanguage(lang) {
        if (lang === 'ta') {
          document.cookie = "googtrans=/en/ta; path=/";
        } else {
          // Clear translation cookie to restore original language
          document.cookie = "googtrans=/en/en; path=/";
          document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
          
          // Clear cookie for parent domain as well just in case
          const domain = window.location.hostname;
          document.cookie = `googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=${domain};`;
          document.cookie = `googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=.${domain};`;
        }
        window.location.reload();
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Google Translate Script -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'ta',

          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>
